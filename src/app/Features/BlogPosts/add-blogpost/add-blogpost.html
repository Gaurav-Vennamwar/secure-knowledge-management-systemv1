<div class="container blog-editor-wrapper">

  <div class="blog-editor-card app-card">

    <!-- Header -->
    <div class="editor-header">

      <div class="editor-badge">
        🚀 Publishing Studio
      </div>

      <h1 class="editor-title">
        Create Blog Post
      </h1>

      <p class="editor-subtitle">
        Share secure knowledge with your audience through powerful content publishing
      </p>

    </div>

    <!-- Form -->
    <form
      [formGroup]="addBlogPostForm"
      class="editor-form"
    >

      <!-- Title -->
      <div class="editor-group">

        <label class="editor-label">
          Blog Title
        </label>

        <input
          type="text"
          class="form-control editor-input title-input"
          formControlName="tittle"
          placeholder="Enter blog title..."
        />

      </div>

      <!-- Short Description -->
      <div class="editor-group">

        <label class="editor-label">
          Short Description
        </label>

        <input
          type="text"
          class="form-control editor-input"
          formControlName="shortDescription"
          placeholder="Briefly describe your article..."
        />

      </div>

      <!-- URL -->
      <div class="editor-group">

        <label class="editor-label">
          URL Handle
        </label>

        <input
          type="text"
          class="form-control editor-input"
          formControlName="urlHandle"
          placeholder="your-blog-url"
        />

      </div>

      <!-- Content -->
      <div class="editor-group">

        <label class="editor-label">
          Blog Content
        </label>

        <textarea
          class="form-control editor-textarea"
          formControlName="content"
          rows="10"
          placeholder="Write your amazing content here..."
        ></textarea>

      </div>

      <!-- Image -->
      <div class="editor-group">

        <label class="editor-label">
          Featured Image URL
        </label>

        <input
          type="text"
          class="form-control editor-input"
          formControlName="featuredImageUrl"
          placeholder="Paste image URL..."
        />

      </div>

      <!-- Row -->
      <div class="editor-row">

        <!-- Date -->
        <div class="editor-group flex-fill">

          <label class="editor-label">
            Published Date
          </label>

          <input
            type="date"
            class="form-control editor-input"
            formControlName="publishedDate"
          />

        </div>

        <!-- Author -->
        <div class="editor-group flex-fill">

          <label class="editor-label">
            Author
          </label>

          <input
            type="text"
            class="form-control editor-input"
            formControlName="author"
            placeholder="Author name"
          />

        </div>

      </div>

      <!-- Visibility -->
      <div class="visibility-toggle">

        <div>

          <h6 class="visibility-title">
            Visibility
          </h6>

          <p class="visibility-subtitle">
            Control whether this blog post is publicly visible
          </p>

        </div>

        <label class="modern-switch">

          <input
            type="checkbox"
            formControlName="isVisible"
          />

          <span class="slider"></span>

        </label>

      </div>

      <!-- Actions -->
      <div class="editor-actions">

        <button
          class="btn-publish"
          type="submit"
        >

          <span>🚀</span>
          <span>Publish Post</span>

        </button>

      </div>

    </form>

  </div>

</div>
