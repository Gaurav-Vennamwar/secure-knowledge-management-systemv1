@if (showImageSelector()) {
  <div class="media-modal-backdrop">
    <div class="media-modal">
      <div class="media-modal-body">
        <div class="image-manager-wrapper">
          <div class="image-manager-card">
            <!-- HEADER -->

            <div class="manager-header">
              <div>
                <div class="manager-badge">📸 Media Studio</div>

                <h2 class="manager-title">Image Manager</h2>

                <p class="manager-subtitle">
                  Upload, preview and organize visual assets for your knowledge platform
                </p>
              </div>

              <button type="button" class="close-modal-btn" (click)="closeImageSelector()">
                ✕
              </button>
            </div>

            <!-- CONTENT -->

            <div class="row g-4">
              <!-- ===================================== -->
              <!-- LEFT SIDE : IMAGE PREVIEW -->
              <!-- ===================================== -->

              <div class="col-lg-8">
                <div class="preview-panel">
                  <div class="preview-topbar">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>

                    <span class="preview-label"> Live Preview </span>
                  </div>

                  <div class="empty-preview">
                    <div class="preview-icon">🖼️</div>

                    <h3>Image Preview</h3>

                    <p>Upload an image to see a live preview here.</p>
                  </div>
                </div>
              </div>

              <!-- ===================================== -->
              <!-- RIGHT SIDE : UPLOAD PANEL -->
              <!-- ===================================== -->

              <div class="col-lg-4">
                <div class="upload-panel">
                  <h4 class="upload-title">Upload Image</h4>

                  <p class="upload-subtitle">Add media assets to your content library</p>

                  <form [formGroup]= "imageSelectormUploadForm" (ngSubmit)="onSubmit()">
                    <!-- FILE -->

                    <div class="mb-3">
                      <label class="upload-label" class="form-control"> Select Image </label>

                      <input type="file" class="premium-file-input" (change)="onFileSelected($event)"/>
                    </div>

                    <!-- FILE NAME -->

                    <div class="mb-3">
                      <label class="upload-label"> File Name </label>

                      <input type="text" class="premium-input" placeholder="example-image" formControlName="name"/>
                    </div>

                    <!-- TITLE -->

                    <div class="mb-4">
                      <label class="upload-label"> Title </label>

                      <input type="text" class="premium-input" placeholder="Featured Blog Banner" formControlName="tittle"/>
                    </div>

                    <!-- BUTTON -->

                    <button type="submit" class="upload-btn">
                      <span> 🚀 </span>

                      <span> Upload Asset </span>
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
}
